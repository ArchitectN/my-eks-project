- name: Update web servers
  hosts: webservers
  remote_user: root

tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Ensure nginx is enabled and started
      systemd:
        name: nginx
        enabled: yes
        state: started